<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cygnus X-1 — Gravitational Lensing</title>
<style>
  :root{
    --bg:#020204;
    --fg:#e8e6f0;
    --muted:#6b6a80;
    --warm:#ffb37a;
    --cool:#8b93ff;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg);
    font-family:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
  }
  canvas{ display:block; touch-action:none; }

  #ui{
    position:fixed; inset:0; pointer-events:none;
    opacity:0; transition:opacity 1.8s ease;
  }
  .loaded #ui{ opacity:1; }

  .eyebrow{
    color:var(--muted); font-size:10px; letter-spacing:0.35em;
    text-transform:uppercase; margin:0 0 8px 0;
  }
  .title{
    color:var(--fg); font-size:22px; letter-spacing:0.3em;
    text-transform:uppercase; margin:0; font-weight:500;
  }
  .rule{ width:46px; height:1px; background:var(--cool); opacity:0.6; margin:14px 0 0 0; }
  #topleft{ position:absolute; top:28px; left:30px; }

  #instructions{
    position:absolute; bottom:26px; right:30px;
    color:var(--muted); font-size:10px; letter-spacing:0.18em;
    text-transform:uppercase; text-align:right; line-height:1.8;
  }
  #readout{
    position:absolute; bottom:26px; left:30px;
    color:var(--muted); font-size:10px; letter-spacing:0.14em;
    text-transform:uppercase; line-height:1.8;
  }
  #readout span{ color:var(--warm); }

  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--muted); font-size:11px; letter-spacing:0.3em;
    text-transform:uppercase; z-index:10; transition:opacity 0.8s ease;
  }
  .loaded #loading{ opacity:0; pointer-events:none; }

  .lil-gui{ --width:260px; font-family:inherit !important; }

  @media (prefers-reduced-motion: reduce){
    #ui, #loading{ transition:none; }
  }
</style>
</head>
<body>
  <div id="loading">Integrating geodesics…</div>
  <div id="ui">
    <div id="topleft">
      <p class="eyebrow">Gravitational Lensing — Live Raymarch</p>
      <h1 class="title">Cygnus&nbsp;X-1</h1>
      <div class="rule"></div>
    </div>
    <div id="readout">
      RESOLUTION <span id="res">0×0</span><br>
      <span id="fps">0</span> FPS
    </div>
    <div id="instructions">
      Drag to orbit · Scroll to zoom<br>
      Panel: adjust mass, disk, bloom
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
